<html>
<head>

<title>Somiland VTuber</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0" />

<link rel="stylesheet" href="css/main.css" type="text/css" />
<link rel="stylesheet" href="css/somiland-vtuber.css" type="text/css" />

<script language="javascript">
var use_SA_browser_mode = true
var _url_search_params_ = { cmd_line: "demo20" }
</script>
<script type="text/javascript" language="javascript" src="js/core.js"></script>
<script type="text/javascript" language="javascript" src="js/core_extra.js"></script>
<script language="javascript">
SA_load_scripts()
</script>

</head>
<body onload="init()">

<script language="javascript">
SA_load_body()
</script>

<script language="javascript">
SA_load_body2()
</script>

<section id="somiland-vtuber-panel" class="sv-panel" aria-label="소미랜드 VTuber 컨트롤">
  <header class="sv-header">
    <div>
      <p class="sv-eyebrow">macOS 개인용</p>
      <h1>Somiland VTuber</h1>
    </div>
    <button id="sv-toggle-panel" class="sv-icon-button" type="button" aria-label="컨트롤 패널 접기">−</button>
  </header>

  <div id="sv-panel-body" class="sv-panel-body">
    <p id="sv-status" class="sv-status" role="status">엔진 준비 중…</p>

    <div class="sv-section">
      <h2>모델</h2>
      <button id="sv-load-vrm" class="sv-button sv-button-primary" type="button">VRM 불러오기</button>
      <p id="sv-current-vrm" class="sv-muted">마지막 VRM 없음</p>
    </div>

    <div class="sv-section">
      <h2>카메라</h2>
      <div class="sv-row">
        <button id="sv-refresh-cameras" class="sv-button" type="button">카메라 권한/목록 갱신</button>
      </div>
      <label class="sv-label" for="sv-camera-select">입력 카메라</label>
      <select id="sv-camera-select" class="sv-select">
        <option value="">기본 카메라</option>
      </select>
    </div>

    <div class="sv-section">
      <h2>트래킹</h2>
      <div class="sv-grid" role="group" aria-label="트래킹 모드">
        <button class="sv-button sv-tracking" type="button" data-mode="Face">얼굴</button>
        <button class="sv-button sv-tracking" type="button" data-mode="Face+Body">얼굴+상반신</button>
        <button class="sv-button sv-tracking" type="button" data-mode="Body+Hands">상반신+손</button>
      </div>
      <p class="sv-muted">전신 모드는 숨겼습니다. 현재 엔진 제한상 손 포함 모드는 기존 Body+Hands 프리셋을 사용합니다.</p>
    </div>

    <div class="sv-section">
      <h2>OBS 배경</h2>
      <div class="sv-grid" role="group" aria-label="OBS 배경 모드">
        <button class="sv-button sv-background" type="button" data-background="transparent">투명</button>
        <button class="sv-button sv-background" type="button" data-background="green">크로마 그린</button>
        <button class="sv-button sv-background" type="button" data-background="black">검정</button>
      </div>
    </div>
  </div>
</section>

<button id="sv-show-panel" class="sv-show-panel" type="button" aria-label="컨트롤 패널 열기" hidden>컨트롤</button>

<script type="text/javascript" src="js/somiland-vtuber/launcher.js"></script>

</body>
</html>
